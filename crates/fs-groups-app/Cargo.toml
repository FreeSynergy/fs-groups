[package]
name = "fs-groups-app"
description = "The groups program of FreeSynergy, window: the window shell (ADR 0065) around the generated Admin frontend (ADR 0066) over the Cap'n Proto socket; no render code of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-groups-core = { path = "../fs-groups-core" }
# The generated frontend and the shell. One commit for all of them (the frontend's own dependencies are paths in it).
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", rev = "7b47a65" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "7b47a65" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", rev = "7b47a65" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", rev = "7b47a65" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11", features = ["rpc"] }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11" }
capnp = "0.27"
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
fs-groups-server = { path = "../fs-groups-server" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
