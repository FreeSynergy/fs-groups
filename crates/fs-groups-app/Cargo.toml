[package]
name = "fs-groups-app"
description = "The groups program of FreeSynergy, window: list, read, create, rename, set the kind of and delete groups, over the Cap'n Proto socket; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-interfaces = { git = "https://www.github.com/FreeSynergy/fs-interfaces", tag = "v0.0.8", features = ["rpc"] }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.1" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.1" }
capnp = "0.27"
uuid = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
fs-groups-core = { path = "../fs-groups-core" }
fs-groups-server = { path = "../fs-groups-server" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
