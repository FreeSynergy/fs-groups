[package]
name = "fs-groups-app"
description = "The groups program of FreeSynergy, window: list, read, create, rename, set the kind of and delete groups, over the Cap'n Proto socket; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", rev = "9a288a6", features = ["rpc"] }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "11d3ca47d32bbf379ce1d482af2bc4f2c0d0e771" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", rev = "11d3ca47d32bbf379ce1d482af2bc4f2c0d0e771" }
capnp = "0.27"
uuid = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
fs-groups-core = { path = "../fs-groups-core" }
fs-groups-server = { path = "../fs-groups-server" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.5.0" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
