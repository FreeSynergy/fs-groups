[package]
name = "fs-groups-server"
description = "Cap'n Proto server of FreeSynergy groups: the contract groups.capnp over a Unix socket, in front of any provider of the groups traits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_groups_server"

[[bin]]
name = "fs-groups-server"
path = "src/main.rs"

[dependencies]
fs-groups-core = { path = "../fs-groups-core" }
# TEMPORARY branch: pin the tag once run_to_end and the Memberships cursor are tagged.
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", branch = "groups-members-cursor", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
capnp-rpc = "0.27"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["full"] }
