[package]
name = "fs-groups-server"
description = "Cap'n Proto server of FreeSynergy groups: the contract groups.capnp over a Unix socket, in front of any provider of the groups traits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_groups_server"

[[bin]]
name = "fs-groups-server"
path = "src/main.rs"

[dependencies]
fs-groups-core = { path = "../fs-groups-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.22.0", features = ["rpc"] }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
capnp = "0.27"
capnp-rpc = "0.27"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["full"] }
