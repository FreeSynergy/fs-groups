[package]
name = "fs-groups"
description = "FreeSynergy.Groups: groups, nesting, members, invitations and rights. Without arguments the window opens; `serve` runs the server."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-groups"
path = "src/main.rs"

[features]
default = ["gui"]
# The window (Blinc). Without it the binary has the server only: `cargo build --no-default-features`.
gui = ["dep:fs-groups-app"]
# Only for the typing test, in a debug build (see fs-groups-app): the window writes the text of its fields to
# FS_TEST_ACCESS_FILE. Never in a release.
test-access = ["gui", "fs-groups-app/test-access"]

[dependencies]
fs-groups-server = { path = "../fs-groups-server" }
fs-groups-app = { path = "../fs-groups-app", optional = true }

[dev-dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19", features = ["rpc"] }
uuid = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
capnp = "0.27"
