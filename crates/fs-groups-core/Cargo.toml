[package]
name = "fs-groups-core"
description = "Program core of FreeSynergy groups: nested groups, memberships, invitations, delegation, mirroring to a directory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
# The contract and the provider rule (ADR 0045).
# TEMPORARY branch: pin the tag once run_to_end and the Memberships cursor are tagged.
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", branch = "groups-members-cursor" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
