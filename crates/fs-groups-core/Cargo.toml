[package]
name = "fs-groups-core"
description = "Program core of FreeSynergy groups: nested groups, memberships, invitations, delegation, mirroring to a directory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# The contract and the provider rule (ADR 0045).
fs-interfaces = { git = "https://www.github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11" }
fs-types = { git = "https://www.github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
icu_properties = "2"
unicode-normalization = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
